# PRODUCTION PROFILE - M8 F-01
#
# Every secret / credential below MUST come from the environment. None of these
# placeholders has a default, so a missing variable fails context startup
# instead of silently falling back to the development defaults in
# application.yml. Use: SPRING_PROFILES_ACTIVE=prod
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# JWT signing key - MANDATORY, no dev fallback (>= 32 bytes).
jwt:
  secret: ${JWT_SECRET}

# Seed-user passwords (same exact keys DataInitializer consumes) - MANDATORY.
app:
  seed:
    admin-password: ${DAGACS_ADMIN_PASSWORD}
    hod-password: ${DAGACS_HOD_PASSWORD}
    teacher-password: ${DAGACS_TEACHER_PASSWORD}
    student-password: ${DAGACS_STUDENT_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}