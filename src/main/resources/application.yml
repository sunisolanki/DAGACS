spring:
  application:
    name: dagacs

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dagacs}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    com.dagacs: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN

# JWT
# DEVELOPMENT DEFAULT ONLY - MUST be overridden with a strong JWT_SECRET in production.
jwt:
  secret: ${JWT_SECRET:dagacs-dev-secret-change-me-in-production-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# API
api:
  version: v1
  prefix: /api

# Development seed users (BCrypt hashed at startup). Override in production.
app:
  seed:
    admin-password: ${DAGACS_ADMIN_PASSWORD:Admin@123}
    hod-password: ${DAGACS_HOD_PASSWORD:Hod@123}
    teacher-password: ${DAGACS_TEACHER_PASSWORD:Teacher@123}
    student-password: ${DAGACS_STUDENT_PASSWORD:Student@123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500}
  # M9.6 M: login rate limiting - conservative, instance-local, ephemeral.
  # Only FAILED (401) logins count; a successful login clears the email counter.
  # Env-overridable, each placeholder carries a development-safe default.
  security:
    login-rate-limit:
      enabled: ${DAGACS_LOGIN_RATE_LIMIT_ENABLED:true}
      max-attempts-per-email: ${DAGACS_LOGIN_MAX_EMAIL_ATTEMPTS:5}
      max-attempts-per-ip: ${DAGACS_LOGIN_MAX_IP_ATTEMPTS:20}
      window-minutes: ${DAGACS_LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}
      # Only honor X-Forwarded-For when the app sits behind a trusted proxy.
      use-forwarded-header: ${DAGACS_LOGIN_USE_FORWARDED_HEADER:false}

